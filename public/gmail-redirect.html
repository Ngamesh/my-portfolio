<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Opening Gmail</title>
    <script>
      try {
        if (localStorage.getItem("theme") === "dark") {
          document.documentElement.classList.add("dark");
        }
      } catch {
        // Keep the light theme if browser storage is unavailable.
      }
    </script>
    <style>
      :root {
        color-scheme: light;
        font-family: "Avenir Next", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f9fafb;
        color: #000;
      }

      :root.dark {
        color-scheme: dark;
        background: #101010;
        color: #fff;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        text-align: center;
      }

      p {
        margin: 0;
        padding: 1rem 1.25rem;
        font-size: 1rem;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <p>Email copied. Opening Gmail...</p>
    <script>
      window.setTimeout(() => {
        window.location.replace("https://mail.google.com/mail/u/0/#compose");
      }, 1500);
    </script>
  </body>
</html>
